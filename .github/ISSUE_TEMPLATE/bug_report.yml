name: Inconsistency report
description: The docs say one thing and the machine says another — or a script/probe does not do what it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most "bugs" in this repository are **inconsistencies**, not crashes. Please bring
        **measurements** — the whole value of this repository is in measured values (see
        [`docs/00-事实基线.md`](https://github.com/JiHuiYiYou/JiHuiYiYou-for-VEX/blob/main/docs/00-%E4%BA%8B%E5%AE%9E%E5%9F%BA%E7%BA%BF.md)).

        Two things that save a lot of back-and-forth:

        * **Check the "待测" (to be measured) list first** — § 13 of the fact baseline says
          what has not been confirmed on real hardware yet. If your result closes one of
          those, that is the most useful thing you can hand this repository.
        * **Capture exit codes with a harness or Python `subprocess`**, not by reading `$?`
          in MSYS2 bash — bash truncates exit codes to 8 bits.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of inconsistency
      options:
        - Docs vs. reality (a number or a conclusion in the fact baseline is wrong)
        - Build scripts (scripts/*.sh)
        - ABI measurement (scripts/measure-abi.sh)
        - Probe behaviour (spike/)
        - Internal contradiction / broken link in the docs
        - Other
    validations:
      required: true

  - type: textarea
    id: claimed
    attributes:
      label: What the docs say
      description: The exact location (§ number, or file:line) and the quoted text.
      placeholder: |
        Fact baseline § 8.1 says: "`V5_DeviceMotorPid` alignof = 1"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What you measured
      description: The command and its raw output. Do not paraphrase it.
      placeholder: |
        $ scripts/measure-abi.sh
        ...
    validations:
      required: true

  - type: input
    id: repro
    attributes:
      label: Reproduction command
      description: The exact command, runnable from the repository root, that produced the output above.
      placeholder: scripts/measure-abi.sh
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        Three lines is enough:
        * VEXcode Pro V5 version (installed at `C:\Program Files (x86)\VEX Robotics\VEXcode Pro V5`)
        * `clang --version`
        * Platform (Windows version / MSYS2 version)
      placeholder: |
        VEXcode Pro V5: 5.4
        clang 8.0.0 (VEX toolchain)
        Windows 10 19045 + MSYS2
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: |
        Links to related issues or PRs, or which gate you think should be watching this.
    validations:
      required: false
