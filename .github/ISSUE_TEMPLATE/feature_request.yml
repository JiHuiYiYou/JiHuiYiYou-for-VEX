name: Proposal
description: A measurement to take, a gate to add, a document to fix, or a change to the binding surface.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a **probe**, not a product (see
        [`docs/第0步-验收线.md`](https://github.com/JiHuiYiYou/JiHuiYiYou-for-VEX/blob/main/docs/%E7%AC%AC0%E6%AD%A5-%E9%AA%8C%E6%94%B6%E7%BA%BF.md)
        § 3.1). So please be concrete about **which measured value you want to end up
        holding** — not about which feature you want implemented.

  - type: textarea
    id: what
    attributes:
      label: What would we know afterwards
      description: "One sentence: once this is done, what do we know that we do not know now?"
      placeholder: The tick frequency of `vexTasksRun` — the last missing entry in the spec's eight items.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: |
        In particular: **why can this not wait until route B?**
        If it can wait, it should — Step 0's output is knowledge, not code.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer it lands in
      options:
        - Fact baseline (a new measured value)
        - Acceptance line (decomposition / gates)
        - Scripts (scripts/)
        - Probe (spike/)
        - Binding surface (include/jhyy_vex.h and friends)
        - GitHub infrastructure (CI / templates / docs)
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does it land in the compiler repository too
      description: |
        The rule here — **the JHYY compiler repository is never edited from this repo**
        (acceptance line § 3.4). Experiment here, land there, review separately.
      options:
        - No — entirely a repository-local thing
        - Yes — experiment/measure here, land it in the compiler repo in a separate PR
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, references, or which gate you think should watch this.
    validations:
      required: false
