name: 提议
description: 想加一个实测项、一条门、一段文档，或者想改绑定面。
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓是**探针**不是产品（见 [`docs/第0步-验收线.md`](https://github.com/JiHuiYiYou/JiHuiYiYou-for-VEX/blob/main/docs/%E7%AC%AC0%E6%AD%A5-%E9%AA%8C%E6%94%B6%E7%BA%BF.md) § 3.1）。
        所以提议请具体到"**要拿到哪个实测值**"，而不是"要实现哪个功能"。

  - type: textarea
    id: what
    attributes:
      label: 要拿到什么
      description: 一句话：这件事做完之后，我们会**知道**什么现在不知道的东西？
      placeholder: 知道 `vexTasksRun` 的 tick 频率（规格书八项里唯一还缺的）。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么现在做
      description: |
        特别是：**为什么不能拖到 B 阶段**？
        如果能拖，就别现在做 —— 第 0 步的产出是知识，不是代码。
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 落在哪一层
      options:
        - 事实基线（新实测值）
        - 验收线（拆解 / 门）
        - 脚本（scripts/）
        - 探针（spike/）
        - 绑定面（include/jhyy_vex.h 一类）
        - GitHub 基建（CI / 模板 / 文档）
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: 要不要回主仓落地
      description: |
        本仓的规矩：**不在这里直接改 JHYY 主仓**（验收线 § 3.4）。
        这里实测 → 回主仓落地 → 单独评审。
      options:
        - 否 —— 纯本仓的事
        - 是 —— 这里只做实验/实测，主仓的改动另开 PR
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 别的
      description: 链接、参考、你觉得该由哪个门盯住。
    validations:
      required: false
